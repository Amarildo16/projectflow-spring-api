services:
  postgres:
    image: postgres:16
    container_name: projectflow_postgres
    environment:
      POSTGRES_DB: projectflow_db
      POSTGRES_USER: projectflow_user
      POSTGRES_PASSWORD: projectflow_pass
    ports:
      - "5433:5432"
    volumes:
      - projectflow_pgdata:/var/lib/postgresql/data

volumes:
  projectflow_pgdata:
